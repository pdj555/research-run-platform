[project]
name = "research-run-platform"
version = "0.1.0"
description = "Research-run data platform proof asset: Parquet/DuckDB storage, FastAPI APIs, provenance, and a run explorer."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.1.3",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[project.scripts]
rdp-api = "rdp.api:run"
rdp-seed = "rdp.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
